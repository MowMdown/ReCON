# Builds the Docker image and publishes it to GitHub Container Registry, only
# when a v* release is published. Pushing commits builds nothing.
#
#   release v1.2.0                     ->  :v1.2.0, :latest  and :<commit sha>
#   pre-release v1.3.0-rc1             ->  :v1.3.0-rc1, :testing and :<commit sha>
#   ("Set as a pre-release" ticked)
#
# Releases whose tag doesn't start with "v" (table-v1 and the like) are skipped.

name: Build and Publish Docker Image

on:
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6   # the commit the release's tag points to

      - name: Set lowercase image name and tags
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          {
            echo "TAGS<<EOF"
            echo "${image}:${TAG}"
            echo "${image}:${GITHUB_SHA}"
            if [ "$PRERELEASE" = "true" ]; then
              echo "${image}:testing"
            else
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.TAGS }}