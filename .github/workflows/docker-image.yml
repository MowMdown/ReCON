# Builds the Docker image and publishes it to GitHub Container Registry, only
# when a v* release is published. Pushing commits builds nothing.
#
#   release v1.2.0                     ->  :v1.2.0, :latest  and :<commit sha>
#   pre-release v1.3.0-rc1             ->  :v1.3.0-rc1, :testing and :<commit sha>
#   ("Set as a pre-release" ticked)
#
# A second image has recon-mod's Live Map built in (--build-arg
# RECON_MOD=true, from ReCON-Mod's main), when the release's code can take
# it (cmd/recon/_mod exists):
#
#   release v1.2.0                     ->  :v1.2.0-mod and :mod
#   pre-release v1.3.0-rc1             ->  :v1.3.0-rc1-mod and :testing-mod
#
# Releases whose tag doesn't start with "v" (table-v1 and the like) are skipped.

name: Build and Publish Docker Image

on:
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6   # the commit the release's tag points to

      - name: Set lowercase image name and tags
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          {
            echo "TAGS<<EOF"
            echo "${image}:${TAG}"
            echo "${image}:${GITHUB_SHA}"
            if [ "$PRERELEASE" = "true" ]; then
              echo "${image}:testing"
            else
              echo "${image}:latest"
            fi
            echo "EOF"
            echo "MOD_TAGS<<EOF"
            echo "${image}:${TAG}-mod"
            if [ "$PRERELEASE" = "true" ]; then
              echo "${image}:testing-mod"
            else
              echo "${image}:mod"
            fi
            echo "EOF"
            if [ -f cmd/recon/_mod/recon_mod.go ]; then echo "WITH_MOD=true"; else echo "WITH_MOD=false"; fi
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.TAGS }}

      - name: Build and publish the image with recon-mod
        if: env.WITH_MOD == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            RECON_MOD=true
          tags: ${{ env.MOD_TAGS }}
