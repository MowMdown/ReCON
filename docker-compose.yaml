services:
  recon-deerisle:
    container_name: deerisle
    image: git.plexraid.stream/mowmdown/recon:testing
    restart: unless-stopped
    networks:
      - proxy-net
    user: "${PUID:-1001}:${PGID:-1001}"
    environment:
      PUID: ${PUID:-1001}
      PGID: ${PGID:-1001}
      TZ: America/New_York
      RCON_HOST: 10.0.1.40
      RCON_PORT: "2305"
      RCON_PASSWORD: ${RCON_PASSWORD1}
      DB_PATH: /data/players.db
      STEAM_API_KEY: ${STEAM_API_KEY}
      STEAM_SEARCH_MODE: "auto"
      STEAM_SEARCH_CORES: "4"
      STEAM_SEARCH_PRIORITY: "high"
      MAXMIND_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID}
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY}
      # Server Info page: the server's Steam query port, serverDZ.cfg's
      # serverTime, and the map's latitude if it isn't Chernarus
      # QUERY_PORT: "27016"
      # SERVER_TIME: "2000/8/31/06/00"
      # SERVER_LATITUDE: "45"
    volumes:
      - /mnt/user/appdata/recon/deerisle:/data
      - /mnt/user/appdata/recon/maps:/data/maps     # shared map pictures, tiles and calibration: maps/<world>/
    ports:
      - "9996:8080"

  recon-namalsk:
