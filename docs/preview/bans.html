<div class="statusbar">
	<span>RCON Status - <b id="rconStatus" class="st">Checking...</b><span id="rconRetry" class="retry"></span></span>
	<span>WebGUI Status - <b id="webStatus" class="st">Checking...</b></span>
</div>
<script>












var setStatusCount;
(function () {
	var fails = 0;
	var text = { connected: 'Connected', retrying: 'Retrying ...', unavailable: 'Unavailable' };
	var state = {}, count = {};
	var retryAt = 0; 
	function show(id, s) {
		if (s) state[id] = s;
		var el = document.getElementById(id);
		if (!state[id]) return;
		var label = text[state[id]] || state[id];
		var cls = state[id];
		if (id === 'rconStatus' && state[id] !== 'connected') {
			
			label = 'Unavailable - Retrying...';
			cls = 'unavailable';
		}
		el.textContent = label + (state[id] === 'connected' && count[id] ? ' - ' + count[id] : '');
		el.className = 'st ' + cls;
	}
	
	function tickRetry() {
		var el = document.getElementById('rconRetry');
		if (state.rconStatus === 'connected' || !retryAt) { el.textContent = ''; return; }
		var s = Math.ceil((retryAt - Date.now()) / 1000);
		el.textContent = s > 0 ? 'next try in ' + (s >= 60 ? Math.floor(s / 60) + 'm ' + String(s % 60).padStart(2, '0') + 's' : s + 's') : 'trying now...';
	}
	setStatusCount = function (t) {
		count.webStatus = t;
		show('webStatus');
	};
	async function check() {
		try {
			var d = await (await fetch('/api/status', { cache: 'no-store' })).json();
			fails = 0;
			retryAt = typeof d.retryInMs === 'number' ? Date.now() + d.retryInMs : 0;
			show('webStatus', 'connected');
			show('rconStatus', d.rcon);
		} catch (e) {
			fails++;
			retryAt = 0;
			var state = fails >= 3 ? 'unavailable' : 'retrying';
			show('webStatus', state);
			show('rconStatus', state);
		}
		tickRetry();
	}
	check();
	setInterval(check, 5000);
	setInterval(tickRetry, 1000);
})();
</script>

<script>
let banned = {}; 
let permBans = []; 

function esc(s) {
	return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtMinutes(b) {
	if (b.perm) return 'Permanent';
	let m = parseInt(b.minutes, 10);
	if (isNaN(m)) return esc(b.minutes);
	let d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60);
	m = m % 60;
	return (d ? d + 'd ' : '') + (h ? h + 'h ' : '') + m + 'm';
}

async function refresh() {
	try {
		let r = await fetch('/api/bans');
		let d = await r.json();
		if (!d.ok) { setStatusCount(''); return; } 
		setStatusCount(d.count + ' ban(s)');
		banned = {};
		d.bans.forEach(function(b) { banned[b.guid] = true; });
		permBans = d.bans.filter(function(b) { return b.perm; });
		document.getElementById('bans').innerHTML = d.bans.map(function(b) {
			let n = esc(b.name);
			return '<tr>' +
				'<td>' + (b.index >= 0 ? b.index : '-') + '</td>' +
				'<td title="' + n + '">' + n + '</td>' +
				'<td class="mono">' + esc(b.guid) + '</td>' +
				'<td>' + fmtMinutes(b) + '</td>' +
				'<td title="' + esc(b.reason) + '">' + esc(b.reason) + '</td>' +
				'<td class="act"><button data-guid="' + esc(b.guid) + '" data-name="' + n + '" onclick="unban(this)">Unban</button></td>' +
			'</tr>';
		}).join('');
	} catch(e) {
		setStatusCount(''); 
	}
}

async function unban(btn) {
	let guid = btn.getAttribute('data-guid');
	let name = btn.getAttribute('data-name');
	if (!confirm('Unban ' + name + '?')) return;
	btn.disabled = true;
	try {
		let r = await fetch('/api/bans/' + encodeURIComponent(guid) + '/unban', { method: 'POST' });
		let d = await r.json();
		if (!d.ok) alert(d.error || 'Unban failed');
	} catch(e) {
		alert('Request failed');
	}
	refresh();
}

async function openBan() {
	let sel = document.getElementById('banPlayer');
	sel.innerHTML = '<option value="">Loading players...</option>';
	document.getElementById('banMinutes').value = '0';
	document.getElementById('banReason').value = '';
	document.getElementById('banModal').style.display = 'flex';
	try {
		let r = await fetch('/api/players/all');
		let d = await r.json();
		if (!d.ok) throw new Error(d.error);
		let list = d.players.filter(function(p) { return !banned[String(p.guid).toLowerCase()]; });
		if (!list.length) {
			sel.innerHTML = '<option value="">No players left to ban</option>';
			return;
		}
		sel.innerHTML = '<option value="">Select a player...</option>' + list.map(function(p) {
			return '<option value="' + esc(p.guid) + '">' + esc(p.name) + (p.offline ? '' : ' (online)') +
				' — ' + esc(String(p.guid).slice(0, 8)) + '</option>';
		}).join('');
	} catch(e) {
		sel.innerHTML = '<option value="">Could not load players</option>';
	}
}

function closeBan() { document.getElementById('banModal').style.display = 'none'; }

document.getElementById('banSubmit').onclick = async function() {
	let btn = this;
	let guid = document.getElementById('banPlayer').value;
	let minutes = parseInt(document.getElementById('banMinutes').value, 10);
	if (!guid) { alert('Select a player first.'); return; }
	if (!Number.isInteger(minutes) || minutes < 0) {
		alert('Duration must be a whole number of minutes (0 = permanent).');
		return;
	}
	btn.disabled = true;
	try {
		let r = await fetch('/api/bans/' + encodeURIComponent(guid) + '/ban', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ reason: document.getElementById('banReason').value, minutes: minutes })
		});
		let d = await r.json();
		if (!d.ok) {
			alert(d.error || d.guid_error || 'Ban failed');
			return;
		}
		closeBan();
		if (d.online && !d.kicked) alert('Player was banned, but the kick was not confirmed.');
	} catch(e) {
		alert('Request failed');
	} finally {
		btn.disabled = false;
		refresh();
	}
};



let pick = { verb: '', rows: [], go: null };





function openPick(title, intro, verb, rows, go) {
	pick = { verb: verb, rows: rows, go: go };
	document.getElementById('pickTitle').textContent = title;
	document.getElementById('pickIntro').textContent = intro;
	let list = document.getElementById('pickList');
	list.textContent = '';
	rows.forEach(function(r, i) {
		let row = document.createElement('label');
		row.className = 'pick' + (r.locked ? ' locked' : '');
		let box = document.createElement('input');
		box.type = 'checkbox';
		box.checked = !!r.checked && !r.locked;
		box.disabled = !!r.locked;
		box.setAttribute('data-i', i);
		box.onchange = updatePicks;
		let span = function(cls, text, title) {
			let e = document.createElement('span');
			e.className = cls;
			e.textContent = text;
			if (title) e.title = title;
			return e;
		};
		let nm = span('nm', (r.name || 'Unknown') + ' - ', (r.name || 'Unknown') + (r.reason ? ' (' + r.reason + ')' : ''));
		nm.append(span('guid', r.guid || '(no GUID)'));
		row.append(box, nm);
		if (r.note) row.append(span('taken', r.note));
		list.append(row);
	});
	updatePicks();
	document.getElementById('pickGo').onclick = function() {
		let chosen = pickBoxes().filter(function(b) { return b.checked; }).map(function(b) { return pick.rows[+b.getAttribute('data-i')]; });
		if (chosen.length) pick.go(chosen);
	};
	document.getElementById('pickModal').style.display = 'flex';
}

function pickBoxes() { return Array.prototype.slice.call(document.querySelectorAll('#pickList input[type=checkbox]:not(:disabled)')); }

function pickSelectAll(on) {
	pickBoxes().forEach(function(b) { b.checked = on; });
	updatePicks();
}


function updatePicks() {
	let boxes = pickBoxes(), n = boxes.filter(function(b) { return b.checked; }).length;
	let all = document.getElementById('pickAll');
	all.checked = n > 0 && n === boxes.length;
	all.indeterminate = n > 0 && n < boxes.length;
	all.disabled = boxes.length === 0;
	let go = document.getElementById('pickGo');
	go.disabled = n === 0;
	go.textContent = n ? pick.verb + ' ' + n + ' ban' + (n === 1 ? '' : 's') : pick.verb;
}

function closePick() { document.getElementById('pickModal').style.display = 'none'; }


function exportBans() {
	if (!permBans.length) { alert('There are no permanent bans to export.'); return; }
	let rows = permBans.map(function(b) {
		let r = { guid: b.guid, name: b.name, reason: b.reason, checked: true };
		if (!/^[0-9a-f]{32}$/.test(String(b.guid))) { r.locked = true; r.note = 'not a valid GUID'; }
		return r;
	});
	openPick('Export bans', 'Permanent bans only. The picked ones are saved to bans.json, to import on another server.', 'Export', rows, function(chosen) {
		closePick();
		downloadFile('/api/bans/export?guids=' + chosen.map(function(r) { return r.guid; }).join(','));
	});
}


function downloadFile(url) { location.href = url; }



async function importBans(input) {
	let file = input.files[0];
	input.value = '';
	if (!file) return;
	let data;
	try { data = JSON.parse(await file.text()); } catch(e) { alert('That file is not valid JSON.'); return; }
	if (!data || !Array.isArray(data.bans) || !data.bans.length) { alert('No bans in that file.'); return; }
	let rows = data.bans.map(function(b) {
		let guid = String((b && b.guid) || '').trim().toLowerCase();
		let r = { guid: guid, name: b && b.name, reason: b && b.reason, ip: b && b.ip, steamId: b && b.steamId, checked: true };
		if (!/^[0-9a-f]{32}$/.test(guid)) { r.locked = true; r.note = 'not a valid GUID'; }
		else if (permBans.some(function(p) { return p.guid === guid; })) { r.locked = true; r.note = 'already banned'; }
		return r;
	});
	openPick('Import bans', file.name + ': ' + rows.length + ' ban(s). The picked ones become permanent bans here; anyone online among them is kicked.', 'Import', rows, async function(chosen) {
		let go = document.getElementById('pickGo');
		go.disabled = true;
		let d;
		try {
			let r = await fetch('/api/bans/import', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ bans: chosen.map(function(r) { return { guid: r.guid, name: r.name || '', reason: r.reason || '', ip: r.ip || '', steamId: r.steamId || '' }; }) })
			});
			d = await r.json();
		} catch(e) { d = { ok: false, error: 'ReCON could not be reached; nothing was imported.' }; }
		closePick();
		if (!d.ok) { alert(d.error || 'Import failed'); return; }
		let msg = 'Imported ' + d.added + ' permanent ban(s).';
		if (d.added) msg += d.onServer ? ' They are on the server\'s ban list now.' : ' The server isn\'t answering: they go on its ban list when ReCON next connects.';
		if (d.kicked) msg += '\n' + d.kicked + ' of them were online and were kicked.';
		if (d.skipped && d.skipped.length) msg += '\n\nSkipped:\n' + d.skipped.join('\n');
		alert(msg);
		refresh();
	});
}

document.addEventListener('keydown', function(e) {
	if (e.key === 'Escape' && document.getElementById('pickModal').style.display === 'flex') closePick();
});

refresh();
setInterval(refresh, 10000);
</script>
<script>




(function () {
	var resets = [];

	function readOrder(storeKey, keys) {
		try {
			var saved = JSON.parse(localStorage.getItem(storeKey) || 'null');
			if (Array.isArray(saved) && saved.length === keys.length &&
				keys.every(function (k) { return saved.indexOf(k) !== -1; })) {
				return saved;
			}
		} catch (e) {}
		return keys.slice();
	}

	function saveOrder(storeKey, order, isDefault) {
		try {
			if (isDefault) { localStorage.removeItem(storeKey); }
			else { localStorage.setItem(storeKey, JSON.stringify(order)); }
		} catch (e) {}
	}

	function setup(table) {
		var headRow = table.tHead && table.tHead.rows[0];
		var body = table.tBodies[0];
		if (!headRow || !body || !body.id) { return; }

		var ths = Array.prototype.slice.call(headRow.cells);
		var keys = ths.map(function (th) { return th.textContent.trim(); });
		var storeKey = 'cols:' + location.pathname + ':' + body.id;
		var order = readOrder(storeKey, keys);

		var thByKey = {};
		ths.forEach(function (th, i) { thByKey[keys[i]] = th; });

		
		var colgroup = table.querySelector('colgroup');
		var cols = colgroup ? Array.prototype.slice.call(colgroup.children) : [];
		var colByKey = null;
		if (cols.length === keys.length) {
			colByKey = {};
			cols.forEach(function (c, i) { colByKey[keys[i]] = c; });
		}

		
		
		function reorderRow(row) {
			var cells = Array.prototype.slice.call(row.children);
			if (cells.length !== keys.length) { return; } 
			var map = {};
			cells.forEach(function (c, i) {
				if (!c.dataset.ck) { c.dataset.ck = keys[i]; }
				map[c.dataset.ck] = c;
			});
			order.forEach(function (k) { if (map[k]) { row.appendChild(map[k]); } });
		}

		function applyBody() { Array.prototype.forEach.call(body.rows, reorderRow); }

		function applyAll() {
			order.forEach(function (k) { headRow.appendChild(thByKey[k]); });
			if (colByKey) { order.forEach(function (k) { colgroup.appendChild(colByKey[k]); }); }
			applyBody();
		}

		
		
		new MutationObserver(applyBody).observe(body, { childList: true });

		var dragKey = null;
		function clearMarks() {
			ths.forEach(function (t) { t.classList.remove('dragging', 'drag-over-left', 'drag-over-right'); });
		}

		ths.forEach(function (th, i) {
			var key = keys[i];
			th.draggable = true;
			th.title = 'Drag to reorder';

			th.addEventListener('dragstart', function (e) {
				dragKey = key;
				e.dataTransfer.effectAllowed = 'move';
				e.dataTransfer.setData('text/plain', key); 
				th.classList.add('dragging');
			});
			th.addEventListener('dragend', function () { dragKey = null; clearMarks(); });
			th.addEventListener('dragover', function (e) {
				if (dragKey === null || dragKey === key) { return; }
				e.preventDefault();
				e.dataTransfer.dropEffect = 'move';
				var movingRight = order.indexOf(dragKey) < order.indexOf(key);
				th.classList.toggle('drag-over-right', movingRight);
				th.classList.toggle('drag-over-left', !movingRight);
			});
			th.addEventListener('dragleave', function () {
				th.classList.remove('drag-over-left', 'drag-over-right');
			});
			th.addEventListener('drop', function (e) {
				e.preventDefault();
				if (dragKey === null || dragKey === key) { clearMarks(); return; }
				var from = order.indexOf(dragKey);
				var to = order.indexOf(key);
				order.splice(from, 1);
				order.splice(to, 0, dragKey);
				clearMarks();
				dragKey = null;
				saveOrder(storeKey, order, order.join('\u0000') === keys.join('\u0000'));
				applyAll();
			});
		});

		resets.push(function () {
			order = keys.slice();
			saveOrder(storeKey, order, true);
			applyAll();
		});
		applyAll();
	}

	Array.prototype.forEach.call(document.querySelectorAll('table'), setup);

	var link = document.getElementById('resetCols');
	if (link) {
		link.addEventListener('click', function (e) {
			e.preventDefault();
			resets.forEach(function (fn) { fn(); });
		});
	}
})();
</script>
</body>
</html>
